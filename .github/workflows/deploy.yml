# Builds the site and deploys it to GitHub Pages.
#
# Runs on pushes to main, when the Silverkeep repo reports a docs change (repository_dispatch,
# sent by Silverkeep's .github/workflows/docs.yml), or by hand.
#
# Needs the secret SILVERKEEP_READ_TOKEN: a fine-grained token with Contents: read on
# BreeDurbin/Silverkeep, used to check out the generated API export, the schemas and the renderer.
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [silverkeep-docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out Silverkeep's docs sources
        uses: actions/checkout@v4
        with:
          repository: BreeDurbin/Silverkeep
          token: ${{ secrets.SILVERKEEP_READ_TOKEN }}
          path: silverkeep
          sparse-checkout: |
            Docs/Generated
            Content/Data/Schemas
            Tools/DocGen

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the reference pages
        run: >
          python silverkeep/Tools/DocGen/render_docs.py
          --api silverkeep/Docs/Generated/silverscript_api.toml
          --schemas silverkeep/Content/Data/Schemas
          --out src/content/docs/docs/reference
          --link-base /SilverkeepStudiosSite/docs/reference
          --public-out public
          --schema-url-base /SilverkeepStudiosSite/schemas

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
